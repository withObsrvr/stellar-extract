name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Track the toolchain declared in go.mod so CI and developers agree.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needs to be run on:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: Tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

  # Every extractor switches on XDR union discriminants. A protocol upgrade can
  # add an arm without breaking the build, so this job flags an available SDK
  # release rather than letting the pin drift silently.
  sdk-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Report available go-stellar-sdk release
        run: |
          current=$(go list -m -f '{{.Version}}' github.com/stellar/go-stellar-sdk)
          latest=$(go list -m -f '{{.Version}}' github.com/stellar/go-stellar-sdk@latest)
          echo "pinned: $current"
          echo "latest: $latest"
          if [ "$current" != "$latest" ]; then
            echo "::warning::go-stellar-sdk $latest is available (pinned: $current). \
            Review the release notes for new XDR union arms before upgrading; \
            protocol_coverage_test.go guards the discriminants this library switches on."
          fi
